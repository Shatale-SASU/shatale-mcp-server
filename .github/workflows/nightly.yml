name: "Nightly: Full regression + performance"

on:
  schedule:
    # Every day at 03:00 UTC (05:00 Paris time)
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # SHAT-3340/3023 — THE LIVE CHAIN RUNS HERE NOW, AND THE REASON IT DID NOT IS GONE.
    #
    # It was off because SHATALE_TEST_KEY belonged to a PERSON'S sandbox account, and purchases every
    # night in an account somebody works in by hand is an owner's decision rather than a pipeline's.
    # The owner decided (17.09.2026): a separate CI account. The publisher ci-nightly with one agent
    # exists, and the secret now holds ITS sandbox key — so the nightly spends in an account that
    # belongs to the pipeline.
    #
    # ⚠️ AND THE ACCEPTANCE IS NOT THIS LINE. SHAT-3023 closes on the first green AUTOMATIC nightly
    # whose log carries the instrument's own notice — "SHAT-3023 live chain: EXECUTED". The script
    # prints EXECUTED / NOT EXECUTED / Could not measure and no "PASSED" string exists; writing one
    # here would be an expectation pretending to be a measurement. The flag makes the run possible,
    # the count is what proves it happened.
    env:
      SHATALE_E2E_LIVE_CHAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc

      - name: Check SHATALE_TEST_KEY
        run: |
          if [ -z "$SHATALE_TEST_KEY" ]; then
            echo "::error::SHATALE_TEST_KEY is required for nightly suite"
            exit 1
          fi
        env:
          SHATALE_TEST_KEY: ${{ secrets.SHATALE_TEST_KEY }}

      # ⚠️ THE PIPE USED TO SWALLOW THE VERDICT, AND EVERYTHING BELOW HUNG OFF IT.
      #
      # A runner `run:` without an explicit `shell:` is `bash -e {0}` — `-e`, but NOT `pipefail`.
      # In `npm test | tee`, the step's exit code is tee's, and tee always succeeds. So a nightly
      # run with failing tests exited 0 and the job went GREEN.
      #
      # That is not one missing alert. Every reaction in this file is gated on `if: failure()` —
      # the server-log artifact, the Telegram message, the Jira issue — so a condition that could
      # never become true silenced all three at once. The failure reporting looked complete and was
      # downstream of something unreachable: the nightly suite could fail every night and the only
      # visible trace would be a green check.
      #
      # Reproduced rather than reasoned: `bash -e -c 'false | tee /dev/null'` exits 0;
      # `bash -eo pipefail -c` on the same line exits non-zero.
      #
      # This repo already knows the rule — ci-public.yml and publish.yml both open with
      # `set -euo pipefail`. Nightly is the one place it was missed, and it is the one workflow
      # where nobody is watching the run live.
      # ⚠️ THE NOTICE STAYS, AND IT IS NOT LEFTOVER TEXT — it is conditional on the opt-in, so with the
      # job-level env above it never prints, and the day somebody removes that line this run says so
      # in the channel a nightly failure is actually read in. Its wording is kept as it was, with the
      # one stale clause corrected: "no API key can create one" was measured false on 17.09.2026.
      # Both kinds of key create agents — POST /v1/agents for a live key, POST /v1/sandbox/agents for
      # a sandbox one (apps/api/main.go:6128); no MCP tool does.
      - name: The live purchase chain is deferred, not passing
        if: env.SHATALE_E2E_LIVE_CHAIN != '1'
        run: |
          echo "::notice title=SHAT-3023 live chain: DISABLED, NOT PASSED::The live provision->request->approve->status->reveal chain did not run in this NIGHTLY, because SHATALE_E2E_LIVE_CHAIN is not 1 - this job sets it, so seeing this notice means the opt-in was removed. SHAT-3340 is closed: the secret holds the sandbox key of the ci-nightly publisher, an account that belongs to the pipeline rather than to a person. Restore the job-level env, or say here why the chain must stay off."

      # --reporter=json alongside the verbose one: the human reads the log, the step below reads the
      # report. Same pair as ci-sandbox.yml, and for the same reason — a skipped suite makes the run
      # PASS, so the colour of this step is not evidence that the chain executed.
      - name: Run full test suite
        id: tests
        run: |
          set -euo pipefail
          npm test -- --reporter=verbose --reporter=json --outputFile=/tmp/vitest-nightly.json 2>&1 | tee /tmp/test-output.txt
        env:
          SHATALE_TEST_KEY: ${{ secrets.SHATALE_TEST_KEY }}

      # 🔴 THE ACCEPTANCE IS A NUMBER, NOT THE COLOUR ABOVE, AND SHAT-3023 CLOSES ON IT. The script
      # reads the run's own JSON report and answers how many live-chain cases EXECUTED, with distinct
      # exit codes for "skipped" and "could not read the report" — one non-zero would merge two facts.
      #
      # ⚠️ `if: always()` ON PURPOSE: when the suite fails, this step above is already red, and the
      # question "did the chain run at all" still needs its own answer, or a failure elsewhere hides a
      # chain that never started.
      - name: The live chain must have EXECUTED, not been skipped
        if: always()
        run: node scripts/live-chain-executed.mjs /tmp/vitest-nightly.json

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-logs-nightly
          path: /tmp/mcp-test-*.log
          retention-days: 14
          if-no-files-found: ignore

      # ── Notifications ──────────────────────────────────────────

      - name: Telegram notification on failure
        if: failure()
        run: |
          FAILED=$(grep -c "FAIL" /tmp/test-output.txt 2>/dev/null || echo "?")
          TOTAL=$(grep -oP '\d+ passed' /tmp/test-output.txt 2>/dev/null || echo "?")
          curl -sf -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="[!!] <b>MCP Nightly FAILED</b>%0A%0AFailed: ${FAILED} | ${TOTAL}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A%0ACheck logs and fix before next deploy." \
            >/dev/null 2>&1 || true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      # ⚠️ ONE TICKET PER DEFECT, NOT ONE PER NIGHT (SHAT-3141). This step used to POST a new issue
      # with a date in its summary on every failure, which produced SHAT-3141, 3074, 2970, 2882, 2835
      # and 2811 — six rows, six nights, ONE defect, all still open. The decision now lives in a
      # script with its own controls, because a decision written inline in YAML is a decision nothing
      # can run.
      - name: Report to Jira (failure)
        if: failure()
        run: node scripts/nightly-jira.mjs --outcome=failed --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # And the other half: when the nightly passes and a report is open, say so THERE. A ticket that
      # only ever grows becomes permanent. It comments; it does not close — whether the cause was
      # understood is a person's judgement, and a green run is not that judgement.
      - name: Report to Jira (recovery)
        if: success()
        run: node scripts/nightly-jira.mjs --outcome=passed --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Telegram notification on success
        if: success()
        run: |
          TOTAL=$(grep -oP '\d+ passed' /tmp/test-output.txt 2>/dev/null || echo "all")
          curl -sf -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="[i] MCP Nightly OK — ${TOTAL}" \
            >/dev/null 2>&1 || true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
