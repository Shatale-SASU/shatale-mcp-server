name: "Publish to npm (Trusted Publishing)"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        type: boolean
        default: true
      # ⚠️ A CHOICE, NOT A URL, AND AN INPUT, NOT A REPOSITORY VARIABLE.
      #
      # This used to come from vars.SHATALE_GATE_API_URL, which was never set — so the gate silently
      # fell back to production while its caller believed the target was configurable. Sergey's
      # release order is staging THEN prod; only the second leg had ever run, and nothing said so.
      #
      # A repository variable is the wrong shape for this even when set: it survives the run that
      # needed it, so the NEXT person's dispatch lands somewhere they did not choose and are not
      # shown. An input has to be answered every time, and the answer is recorded on the run.
      #
      # A choice rather than free text because the two deployments take DIFFERENT keys — sandbox keys
      # are issued per deployment, so a prod key does not authenticate against staging (publish-gate
      # says so in as many words). Typing a URL would leave the key selection to guesswork.
      target:
        description: "Deployment the pre-publish gate must certify"
        type: choice
        options: [staging, prod]
        default: staging

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - name: Run public tests
        run: npm run test:public

  # SHAT-2165. The suite above cannot catch a type divergence against the Go backend —
  # it shipped the same numeric-`mcc` defect in 0.2.1 and again in 0.5.0, green both
  # times, because the mock upstream is this side of the contract. This job drives the
  # BUILT server over stdio against a real deployment and demands a policy DECISION back,
  # which is reachable only if the request body decoded AND the agent exists.
  #
  # It has no skip path. A missing key, an unreachable API or an empty agent list all
  # FAIL — an unearned green here is exactly the failure this gate exists to end, and a
  # release that cannot be verified is a release that does not go out.
  gate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pre-publish gate (real backend, real sandbox key)
        run: npm run gate
        env:
          # ⚠️ TARGET AND KEY ARE CHOSEN TOGETHER, AND BOTH ARE VISIBLE HERE.
          #
          # A release publishes what production runs, so the release trigger certifies PROD — stated
          # literally rather than inherited from a default, because the previous default is exactly
          # what let a staging-intended run certify prod in silence.
          #
          # Sandbox keys are issued PER DEPLOYMENT (publish-gate.mjs says so): a prod-issued key does
          # not authenticate against staging. So the key follows the target, and SHATALE_TEST_KEY —
          # the prod key the nightly suite already uses — is never overwritten to reach staging.
          # Overwriting it would trade one leg of Sergey's order for the other.
          SHATALE_GATE_API_URL: >-
            ${{ (github.event_name == 'release' || inputs.target == 'prod')
                && 'https://api.shatale.com'
                || 'https://api-staging.shatale.com' }}
          SHATALE_GATE_API_KEY: >-
            ${{ (github.event_name == 'release' || inputs.target == 'prod')
                && secrets.SHATALE_TEST_KEY
                || secrets.SHATALE_STAGING_TEST_KEY }}
          # Optional: pin the agent instead of discovering it via GET /v1/agents.
          SHATALE_GATE_AGENT_ID: ${{ vars.SHATALE_GATE_AGENT_ID }}

  publish:
    needs: [test, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write  # Required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npx tsc

      - name: Verify version matches tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version: $PKG_VERSION"

      - name: Publish (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run

      # Authenticates via OIDC trusted publishing (no NPM_TOKEN). Registered at
      # npmjs.com → shatale-mcp-server → Trusted Publisher (repo + publish.yml).
      - name: Publish to npm
        if: github.event.inputs.dry_run != 'true' || github.event_name == 'release'
        run: npm publish --provenance --access public

      - name: Notify on Telegram
        if: success() && github.event_name == 'release'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          curl -sf -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="[i] MCP Server v${VERSION} published to npm" \
            >/dev/null 2>&1 || true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
