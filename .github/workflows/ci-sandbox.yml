name: "CI: Sandbox (authenticated)"

# SHAT-1449: live-sandbox tests no longer gate PRs/pushes. Deterministic
# contract coverage runs in ci-public.yml (mock upstream, no live key); the
# full live suite runs nightly (nightly.yml) and on-demand via this workflow.
on:
  workflow_dispatch:

jobs:
  sandbox-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc

      - name: Check SHATALE_TEST_KEY
        run: |
          if [ -z "$SHATALE_TEST_KEY" ]; then
            echo "::error::SHATALE_TEST_KEY is required to run the live sandbox suite."
            exit 1
          fi
        env:
          SHATALE_TEST_KEY: ${{ secrets.SHATALE_TEST_KEY }}

      # SHAT-3340 — the live purchase chain is DEFERRED, and a skip nobody sees is a pass.
      # The default vitest reporter prints neither skipped test names nor logs from passing tests
      # (both measured 2026-09-14), so the notice is printed here, in the channel this run is read
      # in. Conditional, so it stops claiming the block is off the moment somebody enables it.
      - name: The live purchase chain is deferred, not passing
        if: env.SHATALE_E2E_LIVE_CHAIN != '1'
        run: |
          echo "::notice title=SHAT-3023 live chain: DISABLED, NOT PASSED::The live provision->request->approve->status->reveal chain did not run. Enable with SHATALE_E2E_LIVE_CHAIN=1 once SHAT-3340 is closed: the account owning SHATALE_TEST_KEY has zero agents, and no API key can create one. The deferral is registered in shatale-api (.github/workflows/deferral-conditions.yml), which will REPORT when SHAT-3340 closes - it cannot lift this skip from another repository."

      - name: Run all tests (public + sandbox)
        run: npm test
        env:
          SHATALE_TEST_KEY: ${{ secrets.SHATALE_TEST_KEY }}

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-logs-sandbox
          path: /tmp/mcp-test-*.log
          retention-days: 7
          if-no-files-found: ignore
