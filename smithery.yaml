name: shatale
title: "Shatale — AI Agent Payments (Sandbox)"
description: |
  Give your AI agents the ability to spend money within delegated budgets and policy controls.
  Request purchases, generate and validate spending policies, and simulate authorisations — all from
  your IDE.

  Features:
  - Guest mode (no signup): simulated purchase flow, policy templates, merchant/MCC catalog
  - Sandbox mode (free API key): the full lifecycle against sandbox data — onboarding,
    authorization simulation, approval, credentials, status and audit
  - Policy engine: spend limits, MCC blocking, balance checks
  - Works with Claude Desktop, Cursor, Windsurf, Claude Code

  No card number or CVV is ever returned into the agent's context. Live mode exists and moves
  real money, behind three separate deliberate acts (a live key, SHATALE_MODE=live, and a
  SHA-256-matched SHATALE_MONEY_GO); with a sandbox key none of it is reachable.

icon: "https://shatale.com/favicon.svg"
sourceUrl: "https://github.com/Shatale-SASU/shatale-mcp-server"
homepage: "https://shatale.com/mcp"

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      SHATALE_API_KEY:
        type: string
        description: "Sandbox API key (sk_sandbox_*). Get one free at shatale.com/signup. Optional — guest mode works without it."
    required: []
  commandFunction: |
    (config) => ({
      command: "npx",
      args: ["shatale-mcp-server"],
      env: config.SHATALE_API_KEY ? { SHATALE_API_KEY: config.SHATALE_API_KEY } : {}
    })

tags:
  - payments
  - fintech
  - ai-agents
  - sandbox
  - virtual-cards
  - policy-engine
